services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gym
      POSTGRES_USER: gym
      POSTGRES_PASSWORD: gym
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gym -d gym']
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://gym:gym@db:5432/gym
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '3000:3000'
    volumes:
      - ./src:/app/src

volumes:
  postgres_data:
